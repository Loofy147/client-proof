name: verify-client-proofs

on:
  push:
  pull_request:

jobs:
  mcp-rest-proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofs/MCP-REST-001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
