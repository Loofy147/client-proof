name: verify-client-proofs

on:
  push:
  pull_request:

jobs:
  mcp-rest-proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofs/MCP-REST-001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify MCP REST proof
        working-directory: proofs/MCP-REST-001
        run: npm install --ignore-scripts && npm run check && npm test
      - name: Verify API integration proof
        working-directory: proofs/API-INTEGRATION-001
        run: npm install --ignore-scripts && npm run check && npm test
      - name: Verify workflow proof
        working-directory: proofs/WORKFLOW-001
        run: npm install --ignore-scripts && npm run check && npm test
